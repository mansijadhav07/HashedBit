<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2022 Points Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:first-child {
            text-align: center;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        td:first-child {
            text-align: center;
            font-weight: bold;
            color: #667eea;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #f5f5f5;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .team-name {
            font-weight: 600;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #e74c3c;
        }

        .positive {
            color: #27ae60;
            font-weight: 600;
        }

        .negative {
            color: #e74c3c;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.85em;
            }

            .table-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 IPL 2022 Points Table</h1>
            <p>Sorted by Net Run Rate (NRR)</p>
        </div>
        <div class="table-container">
            <div id="loading" class="loading">Loading data...</div>
            <div id="error" class="error" style="display: none;"></div>
            <table id="iplTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>Matches</th>
                        <th>Won</th>
                        <th>Lost</th>
                        <th>Tied</th>
                        <th>NRR</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://my-json-server.typicode.com/FreSauce/json-ipl/data';

        async function fetchIPLData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                throw error;
            }
        }

        function sortByNRR(data) {
            return data.sort((a, b) => parseFloat(a.NRR) - parseFloat(b.NRR));
        }

        function formatNRR(nrr) {
            const nrrValue = parseFloat(nrr);
            const className = nrrValue >= 0 ? 'positive' : 'negative';
            const sign = nrrValue > 0 ? '+' : '';
            return `<span class="${className}">${sign}${nrrValue.toFixed(3)}</span>`;
        }

        function displayData(data) {
            const tableBody = document.getElementById('tableBody');
            const sortedData = sortByNRR(data);

            tableBody.innerHTML = '';

            sortedData.forEach((team, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="team-name">${team.Team}</td>
                    <td>${team.Matches}</td>
                    <td>${team.Won}</td>
                    <td>${team.Lost}</td>
                    <td>${team.Tied}</td>
                    <td>${formatNRR(team.NRR)}</td>
                    <td><strong>${team.Points}</strong></td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('iplTable').style.display = 'table';
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        async function init() {
            try {
                const data = await fetchIPLData();
                displayData(data);
            } catch (error) {
                showError('Failed to load IPL data. Please try again later.');
            }
        }

        init();
    </script>
</body>
</html>
